<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnchorComplete Research Card Preview</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #24282c; background: #f6f7f8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; }
    main { width: min(1000px, 100%); margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    h1 { margin: 0; color: #3c5f7d; font-size: 24px; font-weight: 620; letter-spacing: -.4px; }
    header p { margin: 5px 0 0; color: #747b82; font-size: 14px; }
    .controls { display: flex; gap: 8px; }
    button { padding: 8px 13px; border: 1px solid #d9e0e6; border-radius: 5px; background: #fff; color: #536d83; font: inherit; font-size: 13px; cursor: pointer; }
    button[aria-pressed="true"] { border-color: #577a98; background: #577a98; color: #fff; }
    .card { display: grid; grid-template-columns: 1.12fr .88fr; align-items: center; gap: 28px; padding: 20px; border: 1px solid #e5e8eb; border-radius: 8px; background: #fff; box-shadow: 0 5px 18px #243b4d0a; }
    .media { position: relative; display: block; overflow: hidden; width: 100%; aspect-ratio: 14 / 9; border: 1px solid #e8eaed; border-radius: 5px; background: #fff; }
    .media img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; transition: opacity .16s ease; }
    .animated { opacity: 0; }
    .media:hover .animated, .media:focus-visible .animated, .media.is-playing .animated { opacity: 1; }
    .tag { color: #577a98; font-size: 12px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; }
    h2 { margin: 9px 0; color: #303a42; font-size: 21px; line-height: 1.4; font-weight: 570; }
    .authors { color: #626b73; font-size: 13px; line-height: 1.8; }
    .links { margin-top: 15px; color: #577a98; font-size: 13px; }
    .links a { color: inherit; text-decoration: none; }
    .note { margin-top: 12px; color: #8a9299; font-size: 12px; }
    @media (max-width: 680px) { body { padding: 28px 14px; } header { align-items: flex-start; flex-direction: column; } .card { grid-template-columns: 1fr; gap: 18px; padding: 14px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Research 卡片预览</h1><p>默认显示静态图；悬停图片或点击按钮查看 GIF 动画。</p></div>
      <div class="controls" role="group" aria-label="预览模式">
        <button type="button" id="static" aria-pressed="true">静态图</button>
        <button type="button" id="animated" aria-pressed="false">播放动画</button>
      </div>
    </header>
    <article class="card">
      <a class="media" id="media" href="https://wrchen530.github.io/anchor-complete/" aria-label="打开 AnchorComplete 项目页">
        <img src="images/anchorcomplete_pipeline_thumb.webp?v=video-render-gif-v4" alt="项目视频中的 Partial Point Input 和 Stage 2 mesh 静态画面">
        <img class="animated" src="images/anchorcomplete_pipeline_hover.gif?v=video-render-gif-v4" alt="同一项目视频中的输入、Stage 1 denoising 和 Stage 2 mesh 动画">
      </a>
      <div>
        <div class="tag">arXiv</div>
        <h2>AnchorComplete: Recovering Complete Scene Meshes from Partial Point Clouds</h2>
        <div class="authors">Weirong Chen, Ismail El-Yamany, Ganlin Zhang, Chuanxia Zheng, Andrea Vedaldi, Daniel Cremers</div>
        <div class="links"><a href="https://arxiv.org/abs/2611.03228">arXiv</a> &nbsp;/&nbsp; <a href="anchor-complete/">Project Page</a></div>
        <div class="note">静态图和 GIF 都直接取自项目页当前的视频版本。</div>
      </div>
    </article>
  </main>
  <script>
    const media = document.querySelector('#media');
    const staticButton = document.querySelector('#static');
    const animatedButton = document.querySelector('#animated');
    function setMode(animated) {
      media.classList.toggle('is-playing', animated);
      staticButton.setAttribute('aria-pressed', String(!animated));
      animatedButton.setAttribute('aria-pressed', String(animated));
    }
    staticButton.addEventListener('click', () => setMode(false));
    animatedButton.addEventListener('click', () => setMode(true));
  </script>
</body>
</html>
